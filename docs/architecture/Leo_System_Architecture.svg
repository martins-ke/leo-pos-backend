<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Leo System Architecture</title>
  <desc id="description">Current Leo runtime architecture: a React browser application served as static files, connecting directly or through an optional reverse proxy to a Spring Boot API and MySQL database.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700;fill:#fff}
      .subtitle{font-size:14px;fill:#cbd5e1}
      .box{stroke-width:2}
      .browser{fill:#eaf2ff;stroke:#6c8ebf}
      .static{fill:#eaf8f1;stroke:#78bb98}
      .proxy{fill:#fff8e8;stroke:#d6a84d}
      .api{fill:#fff0ee;stroke:#d77d75}
      .db{fill:#f4edfa;stroke:#9673a6}
      .label{font-size:17px;font-weight:700}
      .detail{font-size:13px;fill:#526176}
      .arrow{fill:none;stroke:#57708e;stroke-width:2.5}
      .optional{fill:none;stroke:#b38a36;stroke-width:2.5;stroke-dasharray:8 6}
      .note{fill:#f5f7fa;stroke:#cbd5e1;stroke-width:1.5}
      .noteText{font-size:14px;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57708e"/>
    </marker>
    <marker id="optionalArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b38a36"/>
    </marker>
  </defs>
  <rect x="25" y="20" width="1150" height="82" rx="14" fill="#17365d"/>
  <text class="title" x="55" y="58">Leo | Current System Architecture</text>
  <text class="subtitle" x="55" y="82">Browser-based retail operations app · React SPA · Spring Boot REST API · MySQL</text>

  <rect class="box static" x="355" y="135" width="245" height="100" rx="14"/>
  <text class="label" x="477" y="170" text-anchor="middle">Static frontend host</text>
  <text class="detail" x="477" y="195" text-anchor="middle">Built React app · HTTPS</text>
  <text class="detail" x="477" y="215" text-anchor="middle">Vite production bundle</text>

  <rect class="box browser" x="55" y="295" width="260" height="135" rx="14"/>
  <text class="label" x="185" y="332" text-anchor="middle">Browser</text>
  <text class="detail" x="185" y="358" text-anchor="middle">React 19 · React Router 7</text>
  <text class="detail" x="185" y="380" text-anchor="middle">AuthContext · protected routes</text>
  <text class="detail" x="185" y="402" text-anchor="middle">Bearer token API requests</text>

  <rect class="box proxy" x="355" y="345" width="245" height="90" rx="14"/>
  <text class="label" x="477" y="380" text-anchor="middle">Optional reverse proxy</text>
  <text class="detail" x="477" y="406" text-anchor="middle">Same-origin API routing</text>

  <rect class="box api" x="705" y="260" width="275" height="165" rx="14"/>
  <text class="label" x="842" y="297" text-anchor="middle">Leo REST API</text>
  <text class="detail" x="842" y="324" text-anchor="middle">Spring Boot 4 · Java 17</text>
  <text class="detail" x="842" y="348" text-anchor="middle">Spring MVC · Security · Validation</text>
  <text class="detail" x="842" y="372" text-anchor="middle">JWT authentication · domain services</text>
  <text class="detail" x="842" y="396" text-anchor="middle">Transactions · authorization</text>

  <path class="box db" d="M1035 285 Q1115 245 1190 285 L1190 405 Q1115 445 1035 405 Z"/>
  <ellipse cx="1112" cy="285" rx="77" ry="20" fill="#f4edfa" stroke="#9673a6" stroke-width="2"/>
  <path d="M1035 405 Q1112 445 1190 405" fill="none" stroke="#9673a6" stroke-width="2"/>
  <text class="label" x="1112" y="334" text-anchor="middle">MySQL</text>
  <text class="detail" x="1112" y="360" text-anchor="middle">Operational +</text>
  <text class="detail" x="1112" y="380" text-anchor="middle">financial records</text>

  <path class="arrow" d="M355 185 H270 V285" marker-end="url(#arrow)"/>
  <path class="arrow" d="M315 330 H660 V320 H695" marker-end="url(#arrow)"/>
  <text class="detail" x="470" y="315" text-anchor="middle">HTTPS JSON · JWT</text>
  <path class="optional" d="M315 395 H345" marker-end="url(#optionalArrow)"/>
  <path class="optional" d="M600 390 H655 V365 H695" marker-end="url(#optionalArrow)"/>
  <text class="detail" x="652" y="413" text-anchor="middle">optional</text>
  <path class="arrow" d="M980 340 H1025" marker-end="url(#arrow)"/>
  <text class="detail" x="1002" y="325" text-anchor="middle">JPA</text>

  <rect class="note" x="55" y="500" width="1090" height="145" rx="14"/>
  <text class="label" x="80" y="535">Production boundaries</text>
  <text class="noteText" x="80" y="566">• Use an explicit HTTPS API origin with configured CORS, or route requests through the optional same-origin proxy.</text>
  <text class="noteText" x="80" y="594">• Keep the database private; supply production secrets and connection settings through deployment configuration.</text>
  <text class="noteText" x="80" y="622">• Payment-provider processing and email delivery are not part of the current application flow.</text>
</svg>
