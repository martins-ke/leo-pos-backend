<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Leo Product Feature Map</title>
  <desc id="description">Mind map of current Leo capabilities across user access, shop operations, inventory, point of sale, customers and credit, finance, and platform administration, with planned integrations called out separately.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700;fill:#fff}
      .subtitle{font-size:14px;fill:#cbd5e1}
      .root{fill:#17365d;stroke:#12354a;stroke-width:2}
      .rootText{font-size:19px;font-weight:700;fill:#fff}
      .node{stroke-width:2}
      .roles{fill:#f4edfa;stroke:#9673a6}
      .ops{fill:#eaf2ff;stroke:#6c8ebf}
      .inventory{fill:#eaf8f1;stroke:#78bb98}
      .sales{fill:#fff8e8;stroke:#d6a84d}
      .customer{fill:#fff0ee;stroke:#d77d75}
      .finance{fill:#f4edfa;stroke:#9673a6}
      .admin{fill:#eaf2ff;stroke:#6c8ebf}
      .boundary{fill:#f5f7fa;stroke:#8ba0bc;stroke-dasharray:8 6}
      .label{font-size:17px;font-weight:700}
      .detail{font-size:13px;fill:#526176}
      .line{fill:none;stroke:#7890aa;stroke-width:2.5}
      .lineDashed{fill:none;stroke:#8ba0bc;stroke-width:2.5;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect x="25" y="20" width="1150" height="82" rx="14" fill="#17365d"/>
  <text class="title" x="55" y="58">Leo | Product Feature Map</text>
  <text class="subtitle" x="55" y="82">Current capabilities; integrations and features not currently implemented are separated below</text>

  <path class="line" d="M460 340 C390 270 340 210 310 180"/>
  <path class="line" d="M490 320 C490 265 490 230 490 210"/>
  <path class="line" d="M715 335 C775 270 825 215 865 185"/>
  <path class="line" d="M730 385 H820"/>
  <path class="line" d="M715 425 C780 500 820 560 850 590"/>
  <path class="line" d="M610 450 C595 520 580 565 565 605"/>
  <path class="line" d="M460 425 C400 510 350 565 310 605"/>
  <path class="lineDashed" d="M450 385 H370"/>

  <rect class="node root" x="455" y="330" width="275" height="120" rx="24"/>
  <text class="rootText" x="592" y="378" text-anchor="middle">LEO</text>
  <text class="rootText" x="592" y="408" text-anchor="middle">Retail POS &amp; Shop Operations</text>

  <rect class="node roles" x="55" y="115" width="280" height="130" rx="16"/>
  <text class="label" x="78" y="150">People &amp; access</text>
  <text class="detail" x="78" y="180">SUPER_ADMIN · OWNER · STAFF</text>
  <text class="detail" x="78" y="204">JWT authentication</text>
  <text class="detail" x="78" y="228">Shop ownership / staff assignment</text>

  <rect class="node ops" x="370" y="115" width="245" height="110" rx="16"/>
  <text class="label" x="393" y="150">Shop operations</text>
  <text class="detail" x="393" y="180">Multiple shops · staff management</text>
  <text class="detail" x="393" y="204">Owner dashboard</text>

  <rect class="node inventory" x="810" y="115" width="310" height="130" rx="16"/>
  <text class="label" x="833" y="150">Inventory</text>
  <text class="detail" x="833" y="180">Product catalogue and stock levels</text>
  <text class="detail" x="833" y="204">Stock adjustments / purchases</text>
  <text class="detail" x="833" y="228">Stock withdrawals</text>

  <rect class="node boundary" x="55" y="325" width="315" height="130" rx="16"/>
  <text class="label" x="78" y="360">Not currently integrated</text>
  <text class="detail" x="78" y="390">Payment-provider processing</text>
  <text class="detail" x="78" y="414">Email password recovery · billing</text>
  <text class="detail" x="78" y="438">Notification delivery</text>

  <rect class="node sales" x="820" y="325" width="300" height="125" rx="16"/>
  <text class="label" x="843" y="360">Point of sale</text>
  <text class="detail" x="843" y="390">Checkout · receipt · sales history</text>
  <text class="detail" x="843" y="414">Stock deduction and payment recording</text>

  <rect class="node admin" x="55" y="545" width="280" height="130" rx="16"/>
  <text class="label" x="78" y="580">Platform administration</text>
  <text class="detail" x="78" y="610">One-time SUPER_ADMIN setup</text>
  <text class="detail" x="78" y="634">Owner accounts and tenant summaries</text>
  <text class="detail" x="78" y="658">Account status management</text>

  <rect class="node finance" x="425" y="590" width="300" height="130" rx="16"/>
  <text class="label" x="448" y="625">Shop finance</text>
  <text class="detail" x="448" y="655">Cash ledger · expenses</text>
  <text class="detail" x="448" y="679">Capital · drawings · audit trail</text>
  <text class="detail" x="448" y="703">Dashboard summaries</text>

  <rect class="node customer" x="810" y="545" width="310" height="130" rx="16"/>
  <text class="label" x="833" y="580">Customers &amp; credit</text>
  <text class="detail" x="833" y="610">Customer records and eligibility</text>
  <text class="detail" x="833" y="634">Debt / credit sales and repayments</text>
</svg>
