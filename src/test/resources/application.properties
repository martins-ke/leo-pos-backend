finance.debt-purge-interval-ms=86400000
spring.datasource.url=jdbc:h2:mem:leo_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
leo.platform.setup-key=test-platform-setup-key
jwt.secret=test-only-jwt-secret-change-before-production-123456
leo.cors.allowed-origins=http://localhost:5173,http://localhost:3000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
