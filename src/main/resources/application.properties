spring.application.name=Leo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
finance.debt-purge-interval-ms=${FINANCE_DEBT_PURGE_INTERVAL_MS:3600000}
server.port=8181
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/leo_pos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tenacioust!}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

spring.jpa.properties.jakarta.persistence.query.timeout=10000
spring.transaction.default-timeout=15

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.org.hibernate.SQL=INFO
leo.platform.setup-key=${LEO_PLATFORM_SETUP_KEY:}
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-before-production-123456}
leo.cors.allowed-origins=${LEO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
