spring.application.name=Leo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
finance.debt-purge-interval-ms=${FINANCE_DEBT_PURGE_INTERVAL_MS:3600000}
server.port=8181
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leo_pos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tenacioust!}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true
logging.level.org.hibernate.SQL=debug
