spring.application.name=Leo
finance.debt-purge-interval-ms=${FINANCE_DEBT_PURGE_INTERVAL_MS:86400000}
server.port=${PORT:8181}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format.sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

spring.jpa.properties.jakarta.persistence.query.timeout=10000
spring.transaction.default-timeout=15

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.root=INFO
logging.level.com.leo.pos=INFO
logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET}
leo.cors.allowed-origins=${LEO_CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
