spring.application.name=Leo
finance.debt-purge-interval-ms=${FINANCE_DEBT_PURGE_INTERVAL_MS:3600000}
server.port=${PORT:8181}

# Production Datasource (injected via Docker / environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/leo_pos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:example_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production, default to validate/update safely
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format.sql=false

# Production Logging: concise and informative
logging.level.root=INFO
logging.level.com.leo.pos=INFO
logging.level.org.hibernate.SQL=WARN
